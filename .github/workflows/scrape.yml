name: Scrape & refresh snapshot

# Free, scheduled data refresh. Runs the reliable (unauthenticated) scrapers,
# regenerates the static viewer snapshot (web/properties.db + .js) and commits
# it back. That commit triggers the Azure Static Web Apps deploy workflow.
#
# NoBroker (logged-in) and the blocked portals are NOT run here — run those
# locally. GitHub Actions gives 2,000 free minutes/month on private repos, and
# a run takes only a few minutes, so this stays effectively free.

on:
  # Manual only for now — you run scraping locally. To enable a nightly refresh
  # later, uncomment the schedule block below (02:00 IST / 20:30 UTC).
  # schedule:
  #   - cron: "30 20 * * *"
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed to commit the refreshed snapshot

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers (reliable sources)
        run: |
          python -m scrapers.builders --all || true
          python -m scrapers.housiey || true

      - name: Rebuild viewer snapshot
        run: python -m src.export_web

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/properties.db web/properties.db.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh property snapshot [skip ci]"
            git push
          fi
