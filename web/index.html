<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Bangalore Premium Property Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="properties.db.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Force the classic JSX runtime (React.createElement) so the in-browser
  // transform emits no ESM `import` statements inside a classic <script>.
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
  });
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  /* Dual-handle price range slider */
  input.range-thumb { -webkit-appearance: none; appearance: none; height: 24px; background: transparent; pointer-events: none; }
  input.range-thumb::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 18px; width: 18px; border-radius: 9999px; background: #fff; border: 2px solid #6366f1; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; pointer-events: auto; margin-top: -1px; }
  input.range-thumb::-moz-range-thumb { height: 18px; width: 18px; border-radius: 9999px; background: #fff; border: 2px solid #6366f1; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; pointer-events: auto; }
  input.range-thumb::-webkit-slider-runnable-track { background: transparent; }
  input.range-thumb::-moz-range-track { background: transparent; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useCallback } = React;

const TARGET = new Set(["whitefield", "marathahalli"]);
const CRITERIA = { minCr: 3, maxCr: 5, minSqft: 2000, possession: "2028-06-30" };
const fmtCr = v => (v == null ? "—" : "₹" + Number(v).toFixed(2) + " Cr");
// Colour cue by price band so the eye can scan value ranges quickly.
const priceBand = v => {
  if (v == null) return "bg-slate-100 text-slate-400 ring-slate-200";
  if (v < 3) return "bg-sky-100 text-sky-800 ring-sky-300";        // < ₹3 Cr
  if (v < 5) return "bg-emerald-100 text-emerald-800 ring-emerald-300"; // ₹3–5 Cr (apartment target)
  if (v < 7) return "bg-amber-100 text-amber-800 ring-amber-300";   // ₹5–7 Cr
  return "bg-rose-100 text-rose-800 ring-rose-300";                 // ₹7 Cr+
};
const cls = (...a) => a.filter(Boolean).join(" ");

/* ---------- small UI atoms ---------- */
function Stat({ label, value, sub, accent, onClick, active }) {
  const clickable = !!onClick;
  return (
    <div onClick={onClick} role={clickable ? "button" : undefined}
      title={clickable ? "Click to filter" : undefined}
      className={cls("rounded-xl bg-white border shadow-sm px-4 py-3 transition select-none",
        clickable && "cursor-pointer hover:shadow-md hover:border-slate-300 active:scale-[0.99]",
        active ? "border-indigo-500 ring-2 ring-indigo-200" : "border-slate-200")}>
      <div className="text-xs font-medium uppercase tracking-wide text-slate-400 flex items-center gap-1">
        {label}{active && <span className="text-[9px] font-bold text-indigo-500">● ON</span>}
      </div>
      <div className={cls("text-2xl font-bold mt-0.5", accent || "text-slate-800")}>{value}</div>
      {sub && <div className="text-xs text-slate-400 mt-0.5">{sub}</div>}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">{label}</span>
      {children}
    </label>
  );
}

const inputCls =
  "rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm " +
  "focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none";

function Badge({ kind }) {
  const map = {
    villa: "bg-violet-100 text-violet-700",
    apartment: "bg-sky-100 text-sky-700",
    primary: "bg-emerald-100 text-emerald-700",
    resale: "bg-amber-100 text-amber-700",
  };
  return <span className={cls("px-2 py-0.5 rounded-md text-xs font-medium", map[kind] || "bg-slate-100 text-slate-600")}>{kind}</span>;
}

/* ---------- filter bar ---------- */
const EMPTY = {
  q: "", locality: "", type: "", listing: "", builder: "", source: "",
  minCr: "", maxCr: "", minSize: "", possession: "", onlyPriced: false, onlyTarget: false, onlyFav: false,
};

function PriceRange({ f, set, max }) {
  const lo = f.minCr === "" ? 0 : Math.max(0, parseFloat(f.minCr));
  const hi = f.maxCr === "" ? max : Math.min(max, parseFloat(f.maxCr));
  const pct = v => (max ? (v / max) * 100 : 0);
  const setLo = v => { v = Math.min(v, hi); set({ ...f, minCr: v <= 0 ? "" : String(v) }); };
  const setHi = v => { v = Math.max(v, lo); set({ ...f, maxCr: v >= max ? "" : String(v) }); };
  return (
    <Field label="Price (₹ Cr)">
      <div className="w-full min-w-[12rem]">
        <div className="flex justify-between text-xs mb-1">
          <span className="font-semibold text-slate-700 tabular-nums">₹{lo.toFixed(1)}</span>
          <span className="font-semibold text-slate-700 tabular-nums">₹{hi.toFixed(1)}{hi >= max ? "+" : ""}</span>
        </div>
        <div className="relative h-6">
          <div className="absolute top-1/2 -translate-y-1/2 h-1.5 w-full rounded-full bg-slate-200" />
          <div className="absolute top-1/2 -translate-y-1/2 h-1.5 rounded-full bg-indigo-500"
               style={{ left: pct(lo) + "%", right: (100 - pct(hi)) + "%" }} />
          <input type="range" min="0" max={max} step="0.1" value={lo}
                 onChange={e => setLo(parseFloat(e.target.value))}
                 className="range-thumb absolute inset-0 w-full" />
          <input type="range" min="0" max={max} step="0.1" value={hi}
                 onChange={e => setHi(parseFloat(e.target.value))}
                 className="range-thumb absolute inset-0 w-full" />
        </div>
      </div>
    </Field>
  );
}

// Searchable single-select combobox — type to filter the option list, click to
// pick. Falls back to a clearable text box; keeps the whole thing keyboard/touch
// friendly on mobile where a long native <select> is unwieldy.
function SearchableSelect({ value, onChange, options, placeholder = "any" }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const boxRef = React.useRef(null);
  useEffect(() => {
    const onDoc = e => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const list = useMemo(() => {
    const needle = q.trim().toLowerCase();
    const arr = needle ? options.filter(o => o.toLowerCase().includes(needle)) : options;
    return arr.slice(0, 200);
  }, [q, options]);
  const pick = v => { onChange(v); setOpen(false); setQ(""); };
  return (
    <div className="relative w-full" ref={boxRef}>
      <button type="button" onClick={() => { setOpen(o => !o); setQ(""); }}
        className={cls(inputCls, "w-full flex items-center justify-between gap-2 text-left")}>
        <span className={cls("truncate", value ? "text-slate-800" : "text-slate-400")}>{value || placeholder}</span>
        <span className="flex items-center gap-1 shrink-0">
          {value && <span onClick={e => { e.stopPropagation(); pick(""); }}
                          className="text-slate-400 hover:text-rose-500 text-xs px-1">✕</span>}
          <span className="text-slate-400 text-xs">▾</span>
        </span>
      </button>
      {open && (
        <div className="absolute z-30 mt-1 w-full rounded-lg border border-slate-200 bg-white shadow-lg">
          <div className="p-2 border-b border-slate-100">
            <input autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder="type to search…"
              className="w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />
          </div>
          <ul className="max-h-60 overflow-y-auto py-1 text-sm">
            <li><button type="button" onClick={() => pick("")}
                        className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-400 italic">{placeholder}</button></li>
            {list.map(o => (
              <li key={o}><button type="button" onClick={() => pick(o)}
                    className={cls("w-full text-left px-3 py-1.5 hover:bg-indigo-50 truncate",
                                   o === value ? "bg-indigo-50 text-indigo-700 font-semibold" : "text-slate-700")}>{o}</button></li>
            ))}
            {list.length === 0 && <li className="px-3 py-2 text-slate-400 italic">no matches</li>}
          </ul>
        </div>
      )}
    </div>
  );
}

function Filters({ f, set, options, onReset, onCriteria }) {
  const upd = (k) => (e) => set({ ...f, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const Sel = (k, list, any = "any") => (
    <select className={cls(inputCls, "w-full")} value={f[k]} onChange={upd(k)}>
      <option value="">{any}</option>
      {list.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
  return (
    <div className="rounded-2xl bg-white border border-slate-200 shadow-sm p-4">
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3 items-end">
        <Field label="Search">
          <input className={cls(inputCls, "w-full")} placeholder="name, area, description…" value={f.q} onChange={upd("q")} />
        </Field>
        <Field label="Locality">
          <SearchableSelect value={f.locality} onChange={v => set({ ...f, locality: v })} options={options.localities} />
        </Field>
        <Field label="Type">{Sel("type", options.types)}</Field>
        <Field label="Builder">{Sel("builder", options.builders)}</Field>
        <PriceRange f={f} set={set} max={options.priceMax} />
      </div>
      <div className="flex flex-wrap gap-4 items-center mt-3">
        <label className="flex items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" className="rounded" checked={f.onlyPriced} onChange={upd("onlyPriced")} /> Only priced
        </label>
        <label className="flex items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" className="rounded" checked={f.onlyTarget} onChange={upd("onlyTarget")} /> Only Whitefield / Marathahalli
        </label>
        <label className="flex items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" className="rounded accent-amber-500" checked={f.onlyFav} onChange={upd("onlyFav")} /> <span className="text-amber-500">★</span> Only favourites
        </label>
        <div className="flex-1" />
        <button onClick={onCriteria} className="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 shadow-sm">
          ⭐ My criteria
        </button>
        <button onClick={onReset} className="px-3 py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-semibold hover:bg-slate-200">
          Reset
        </button>
      </div>
    </div>
  );
}

/* ---------- results table ---------- */
// Shared cell renderers so the same <Table> can render either the matched
// listings or the dropped/discarded ones — each column knows how to draw itself.
const cellText   = k => r => <span className="text-slate-600">{r[k] || "—"}</span>;
const cellPrice  = r => r.price_cr != null
  ? <span className={cls("inline-block rounded-md px-2 py-0.5 tabular-nums font-bold ring-1", priceBand(r.price_cr))}>{fmtCr(r.price_cr)}</span>
  : <span className="text-slate-300">—</span>;
const cellBhk    = r => r.bhk
  ? <span className="inline-block rounded-md bg-fuchsia-100 text-fuchsia-700 font-bold px-2 py-0.5 text-xs ring-1 ring-fuchsia-300">{r.bhk}</span>
  : <span className="text-slate-300">—</span>;
const cellSize   = r => <span className={cls("tabular-nums", r.size_sqft >= 2000 ? "text-emerald-700 font-semibold" : "text-slate-500")}>
                          {r.size_sqft ? (r.size_sqft >= 2000 ? "✓ " + r.size_sqft : r.size_sqft) : "—"}</span>;
const cellLoc    = r => { const tgt = TARGET.has((r.locality || "").toLowerCase());
  return tgt ? <span className="text-amber-600 font-semibold">★ {r.locality}</span> : (r.locality || "?"); };
const cellLink   = (textKey) => r => r.url
  ? <a href={r.url} target="_blank" rel="noopener" className="text-indigo-600 hover:underline">{r[textKey] || "link"}</a>
  : (r[textKey] || "—");
const cellFav    = (r, ctx) => (
  <button onClick={() => ctx.onToggleFav(r.id)} title={ctx.favIds.has(r.id) ? "Remove from favourites" : "Add to favourites"}
          className={cls("inline-flex items-center justify-center h-7 w-7 rounded-lg ring-1 ring-transparent transition text-lg",
                         ctx.favIds.has(r.id) ? "text-amber-500 hover:bg-amber-50 hover:ring-amber-200"
                                              : "text-slate-300 hover:text-amber-500 hover:bg-amber-50 hover:ring-amber-200")}>
    {ctx.favIds.has(r.id) ? "★" : "☆"}</button>
);
const reasonColor = s => /builder/.test(s || "") ? "bg-orange-100 text-orange-700 ring-orange-300"
                       : /sqft/.test(s || "")   ? "bg-slate-100 text-slate-600 ring-slate-300"
                       : "bg-slate-100 text-slate-600 ring-slate-300";
const cellReason = r => r.drop_reason
  ? <span className={cls("inline-block rounded-md px-2 py-0.5 text-xs font-medium ring-1", reasonColor(r.drop_reason))}>{r.drop_reason}</span>
  : "—";

const COLS = [
  { k: "source", label: "Source", cell: cellText("source"), tdCls: "whitespace-nowrap" },
  { k: "builder", label: "Builder", cell: r => <span className="font-medium">{r.builder}{r.__rescued && <span className="ml-1 align-middle inline-block rounded bg-emerald-100 text-emerald-700 text-[10px] font-bold px-1 py-0.5 ring-1 ring-emerald-300">⤴ rescued</span>}</span>, tdCls: "whitespace-nowrap" },
  { k: "price_cr", label: "Price", num: true, cell: cellPrice, tdCls: "whitespace-nowrap text-right" },
  { k: "description", label: "Details", cell: cellLink("description"), tdCls: "max-w-sm truncate", tdTitle: r => r.description || "" },
  { k: "fav", label: "★", noMenu: true, noSort: true, cell: cellFav, tdCls: "text-center" },
  { k: "bhk", label: "BHK", cell: cellBhk, tdCls: "whitespace-nowrap" },
  { k: "type", label: "Type", cell: r => <Badge kind={r.type} /> },
  { k: "listing", label: "Listing", cell: r => (r.listing ? <Badge kind={r.listing} /> : null) },
  { k: "locality", label: "Locality", cell: cellLoc, tdCls: "align-top max-w-[10rem] break-words" },
  { k: "size_sqft", label: "Sq ft", num: true, cell: cellSize, tdCls: "text-right" },
  { k: "possession", label: "Possession", cell: cellText("possession"), tdCls: "whitespace-nowrap" },
  { k: "rera_id", label: "RERA", cell: r => <span className="text-[11px] text-slate-400">{r.rera_id || "—"}</span>, tdCls: "whitespace-nowrap" },
];

// Columns for the "Dropped / discarded" review grid (schema = v_dropped).
const DROP_COLS = [
  { k: "source", label: "Source", cell: cellText("source"), tdCls: "whitespace-nowrap" },
  { k: "builder", label: "Builder guess", cell: r => <span className="font-medium">{r.builder}</span>, tdCls: "whitespace-nowrap" },
  { k: "price_cr", label: "Price", num: true, cell: cellPrice, tdCls: "whitespace-nowrap text-right" },
  { k: "fav", label: "★", noMenu: true, noSort: true, cell: cellFav, tdCls: "text-center" },
  { k: "society", label: "Society / title", cell: cellLink("society"), tdCls: "max-w-sm truncate", tdTitle: r => r.society || "" },
  { k: "drop_reason", label: "Why dropped", cell: cellReason },
  { k: "bhk", label: "BHK", cell: cellBhk, tdCls: "whitespace-nowrap" },
  { k: "type", label: "Type", cell: r => <Badge kind={r.type} /> },
  { k: "listing", label: "Listing", cell: r => (r.listing ? <Badge kind={r.listing} /> : null) },
  { k: "locality", label: "Locality", cell: cellLoc, tdCls: "align-top max-w-[10rem] break-words" },
  { k: "size_sqft", label: "Sq ft", num: true, cell: cellSize, tdCls: "text-right" },
];

function ColMenu({ c, open, setOpen, sel, setSel, values }) {
  const [search, setSearch] = useState("");
  const [anchor, setAnchor] = useState(null);
  const active = c.num ? !!(sel && (sel.min || sel.max)) : !!(sel && sel.length);
  const funnel = (
    <button
      onClick={(e) => { e.stopPropagation(); setAnchor(e.currentTarget.getBoundingClientRect()); setOpen(open ? null : c.k); }}
      title="Filter column"
      className={cls("ml-1 inline-flex items-center justify-center w-5 h-5 rounded transition align-middle",
                     active ? "bg-indigo-600 text-white" : "text-slate-400 hover:bg-slate-200 hover:text-slate-600")}>
      <svg viewBox="0 0 20 20" fill="currentColor" className="w-3 h-3"><path d="M3 4a1 1 0 011-1h12a1 1 0 01.8 1.6L12 11v4a1 1 0 01-.55.9l-2 1A1 1 0 018 16v-5L3.2 4.6A1 1 0 013 4z"/></svg>
    </button>
  );
  if (!open || !anchor) return funnel;

  let body;
  if (c.num) {
    const cur = sel || { min: "", max: "" };
    const upd = (k) => (e) => setSel(c.k, { ...cur, [k]: e.target.value });
    body = (
      <div className="space-y-2">
        <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Range</div>
        <div className="flex items-center gap-1">
          <input type="number" placeholder="min" value={cur.min} onChange={upd("min")}
                 className="w-20 text-xs border border-slate-200 rounded px-1.5 py-1" />
          <span className="text-slate-400 text-xs">–</span>
          <input type="number" placeholder="max" value={cur.max} onChange={upd("max")}
                 className="w-20 text-xs border border-slate-200 rounded px-1.5 py-1" />
        </div>
      </div>
    );
  } else {
    const cur = sel || [];
    const shown = values.filter(v => v.toLowerCase().includes(search.toLowerCase()));
    const allOn = shown.length > 0 && shown.every(v => cur.includes(v));
    const toggle = (v) => setSel(c.k, cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]);
    const toggleAll = () => setSel(c.k, allOn ? cur.filter(v => !shown.includes(v)) : [...new Set([...cur, ...shown])]);
    body = (
      <div className="space-y-1.5">
        <input placeholder="search values…" value={search} onChange={e => setSearch(e.target.value)}
               className="w-full text-xs border border-slate-200 rounded px-1.5 py-1" />
        <label className="flex items-center gap-2 text-xs font-medium text-slate-600 border-b border-slate-100 pb-1">
          <input type="checkbox" checked={allOn} onChange={toggleAll} /> (Select all)
        </label>
        <div className="max-h-48 overflow-auto pr-1 space-y-0.5">
          {shown.map(v => (
            <label key={v} className="flex items-center gap-2 text-xs text-slate-600 hover:bg-slate-50 rounded px-1 py-0.5">
              <input type="checkbox" checked={cur.includes(v)} onChange={() => toggle(v)} />
              <span className="truncate" title={v}>{v}</span>
            </label>
          ))}
          {shown.length === 0 && <div className="text-xs text-slate-400 px-1 py-2">No values</div>}
        </div>
      </div>
    );
  }

  const W = 240;
  const left = Math.max(8, Math.min(anchor.right - W, window.innerWidth - W - 8));
  const top = anchor.bottom + 4;
  return (
    <>
      {funnel}
      {ReactDOM.createPortal(
        <>
          <div className="fixed inset-0 z-40" onClick={(e) => { e.stopPropagation(); setOpen(null); }} />
          <div onClick={(e) => e.stopPropagation()}
               style={{ position: "fixed", top, left, width: W }}
               className="z-50 rounded-xl border border-slate-200 bg-white shadow-xl p-2.5 font-normal normal-case text-left text-slate-700">
            {body}
            <div className="flex justify-between items-center pt-2 mt-1 border-t border-slate-100">
              <button onClick={() => setSel(c.k, null)} className="text-xs text-slate-500 hover:text-rose-600">Clear</button>
              <button onClick={() => setOpen(null)} className="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Done</button>
            </div>
          </div>
        </>,
        document.body)}
    </>
  );
}

function Table({ rows, cols = COLS, view = "matches", sort, setSort, colSel, setColSel, colValues, onDelete, onRescue, favIds, onToggleFav }) {
  const [openCol, setOpenCol] = useState(null);
  const ctx = { favIds, onToggleFav };
  const arrow = (k) => (sort.k === k ? (sort.dir === "asc" ? " ▲" : " ▼") : "");
  const click = (k) => setSort(s => ({ k, dir: s.k === k && s.dir === "asc" ? "desc" : "asc" }));
  const setSel = (k, val) => setColSel(prev => {
    const next = { ...prev };
    if (val == null || (Array.isArray(val) && !val.length) ||
        (val && !Array.isArray(val) && !val.min && !val.max)) delete next[k];
    else next[k] = val;
    return next;
  });
  return (
    <div className="rounded-2xl border border-slate-200 shadow-sm overflow-hidden bg-white">
      <div className="overflow-auto max-h-[65vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-100/95 backdrop-blur z-10">
            <tr>
              {cols.map(c => (
                <th key={c.k}
                    className={cls("px-3 py-2.5 font-semibold text-slate-600 select-none whitespace-nowrap relative",
                                   c.num ? "text-right" : (c.k === "fav" ? "text-center" : "text-left"))}>
                  {c.noMenu ? (
                    <span className={c.k === "fav" ? "text-amber-500" : ""} title="Favourite">{c.label}</span>
                  ) : (
                    <span className="inline-flex items-center">
                      <span onClick={() => click(c.k)} className="cursor-pointer hover:text-slate-900">{c.label}{arrow(c.k)}</span>
                      <ColMenu c={c} open={openCol === c.k} setOpen={setOpenCol}
                               sel={colSel[c.k]} setSel={setSel} values={colValues[c.k] || []} />
                    </span>
                  )}
                </th>
              ))}
              <th className="px-3 py-2.5 text-right font-semibold text-slate-600 whitespace-nowrap"></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const tgt = TARGET.has((r.locality || "").toLowerCase());
              return (
                <tr key={r.id} className={cls("border-t border-slate-100 hover:bg-indigo-50/40", tgt && "bg-amber-50/40")}>
                  {cols.map(c => (
                    <td key={c.k} className={cls("px-3 py-2", c.tdCls)} title={c.tdTitle ? c.tdTitle(r) : undefined}>
                      {c.cell ? c.cell(r, ctx) : (r[c.k] == null ? "—" : String(r[c.k]))}
                    </td>
                  ))}
                  <td className="px-3 py-2 text-right whitespace-nowrap">
                    <div className="inline-flex items-center gap-1">
                      {view === "dropped" && onRescue && (
                        <button onClick={() => onRescue(r)} title="Move to Matches (rescue this listing)"
                                className="inline-flex items-center justify-center h-7 w-7 rounded-lg text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 ring-1 ring-transparent hover:ring-emerald-200 transition">
                          ⤴
                        </button>
                      )}
                      {view === "matches" && r.__rescued && onRescue && (
                        <button onClick={() => onRescue(r)} title="Return to Dropped"
                                className="inline-flex items-center justify-center h-7 w-7 rounded-lg text-slate-400 hover:text-amber-600 hover:bg-amber-50 ring-1 ring-transparent hover:ring-amber-200 transition">
                          ⤵
                        </button>
                      )}
                      <button onClick={() => onDelete(r)} title="Delete listing"
                              className="inline-flex items-center justify-center h-7 w-7 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 ring-1 ring-transparent hover:ring-rose-200 transition">
                        🗑️
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}
            {rows.length === 0 && (
              <tr><td colSpan={cols.length + 1} className="px-3 py-10 text-center text-slate-400">No listings match these filters.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- advanced raw SQL ---------- */
function SqlPanel({ db }) {
  const [open, setOpen] = useState(false);
  const [sql, setSql] = useState("SELECT source, builder, type, locality, price_cr, possession\nFROM v_listings\nWHERE locality IN ('whitefield','marathahalli')\nORDER BY price_cr;");
  const [res, setRes] = useState(null);
  const [err, setErr] = useState("");
  const run = () => {
    setErr(""); setRes(null);
    try { const r = db.exec(sql); setRes(r.length ? r[0] : { columns: [], values: [] }); }
    catch (e) { setErr(e.message); }
  };
  return (
    <div className="rounded-2xl bg-white border border-slate-200 shadow-sm">
      <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between px-4 py-3 text-sm font-semibold text-slate-600">
        <span>🛠️ Advanced — raw read-only SQL (<code className="bg-slate-100 px-1 rounded">v_listings</code>)</span>
        <span>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div className="px-4 pb-4">
          <textarea value={sql} onChange={e => setSql(e.target.value)}
            className="w-full h-28 rounded-lg border border-slate-300 bg-slate-900 text-emerald-300 font-mono text-xs p-3 outline-none" />
          <div className="mt-2"><button onClick={run} className="px-3 py-2 rounded-lg bg-slate-800 text-white text-sm font-semibold hover:bg-slate-700">Run SQL ▶</button></div>
          {err && <div className="mt-2 text-sm text-rose-600">{err}</div>}
          {res && (
            <div className="mt-3 overflow-auto max-h-72 rounded-lg border border-slate-200">
              <table className="min-w-full text-xs">
                <thead className="bg-slate-100"><tr>{res.columns.map(c => <th key={c} className="px-2 py-1.5 text-left font-semibold text-slate-600">{c}</th>)}</tr></thead>
                <tbody>{res.values.map((row, i) => <tr key={i} className="border-t border-slate-100">{row.map((v, j) => <td key={j} className="px-2 py-1 whitespace-nowrap">{v == null ? "" : String(v)}</td>)}</tr>)}</tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- delete confirmation overlay ---------- */
function ConfirmModal({ row, onCancel, onConfirm }) {
  useEffect(() => {
    if (!row) return;
    const h = (e) => { if (e.key === "Escape") onCancel(); if (e.key === "Enter") onConfirm(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [row, onCancel, onConfirm]);
  if (!row) return null;
  return ReactDOM.createPortal(
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={onCancel} />
      <div className="relative w-full max-w-md rounded-2xl bg-white shadow-2xl border border-slate-200 p-5">
        <div className="flex items-start gap-3">
          <div className="text-2xl">🗑️</div>
          <div className="flex-1">
            <h3 className="text-lg font-bold text-slate-800">Delete this listing?</h3>
            <p className="text-sm text-slate-500 mt-1">It will be hidden from your grid. You can restore hidden listings anytime.</p>
          </div>
        </div>
        <div className="mt-4 rounded-xl bg-slate-50 border border-slate-200 p-3 text-sm">
          <div className="font-semibold text-slate-800 truncate">{row.description || row.builder || ("Listing #" + row.id)}</div>
          <div className="text-slate-500 mt-0.5 flex flex-wrap gap-x-2">
            <span>{row.source}</span>
            {row.locality && <span>· {row.locality}</span>}
            {row.price_cr != null && <span>· {fmtCr(row.price_cr)}</span>}
          </div>
        </div>
        <div className="mt-5 flex justify-end gap-2">
          <button onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-semibold hover:bg-slate-200">Cancel</button>
          <button onClick={onConfirm} className="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-semibold hover:bg-rose-700 shadow-sm">Delete</button>
        </div>
      </div>
    </div>,
    document.body);
}

/* ---------- app ---------- */
function App() {
  const [db, setDb] = useState(null);
  const [all, setAll] = useState([]);
  const [allDrop, setAllDrop] = useState([]);
  const [view, setView] = useState("matches"); // "matches" | "dropped"
  const [meta, setMeta] = useState({ n: 0, updated: "" });
  const [status, setStatus] = useState("loading");
  const [f, setF] = useState(EMPTY);
  const [colSel, setColSel] = useState({});
  const [sort, setSort] = useState({ k: "relevance", dir: "asc" });
  const [deletedIds, setDeletedIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("deletedIds") || "[]")); }
    catch { return new Set(); }
  });
  const [deletedDropIds, setDeletedDropIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("deletedDropIds") || "[]")); }
    catch { return new Set(); }
  });
  const [pendingDelete, setPendingDelete] = useState(null);
  const [favIds, setFavIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("favIds") || "[]")); }
    catch { return new Set(); }
  });
  const [favDropIds, setFavDropIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("favDropIds") || "[]")); }
    catch { return new Set(); }
  });
  const [rescuedIds, setRescuedIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("rescuedIds") || "[]")); }
    catch { return new Set(); }
  });

  // A dropped row promoted into the Matches grid keeps its data but gets a
  // namespaced id ("d"+id) so it never collides with a real listing id in the
  // favourite / delete Sets.
  const dropToMatch = (d) => ({
    ...d, id: "d" + d.id, __rescued: true, __dropId: d.id,
    description: d.society, possession: null, rera_id: null, favourite: 0,
  });
  const matchesRows = useMemo(
    () => [...all, ...allDrop.filter(d => rescuedIds.has(d.id)).map(dropToMatch)],
    [all, allDrop, rescuedIds]);
  const droppedRows = useMemo(
    () => allDrop.filter(d => !rescuedIds.has(d.id)),
    [allDrop, rescuedIds]);

  // Active view wiring — the same grid/filters serve matches and dropped.
  const isDrop = view === "dropped";
  const activeAll = isDrop ? droppedRows : matchesRows;
  const activeCols = isDrop ? DROP_COLS : COLS;
  const activeDeleted = isDrop ? deletedDropIds : deletedIds;
  const activeFav = isDrop ? favDropIds : favIds;

  const toggleFav = useCallback((id) => {
    setFavIds(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      localStorage.setItem("favIds", JSON.stringify([...next]));
      return next;
    });
  }, []);

  const toggleFavDrop = useCallback((id) => {
    setFavDropIds(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      localStorage.setItem("favDropIds", JSON.stringify([...next]));
      return next;
    });
  }, []);

  const activeToggleFav = isDrop ? toggleFavDrop : toggleFav;

  // Rescue = promote a dropped listing into the Matches grid (or, when called
  // on an already-rescued row, send it back to Dropped).
  const toggleRescue = useCallback((row) => {
    const dropId = row.__dropId != null ? row.__dropId : row.id;
    setRescuedIds(prev => {
      const next = new Set(prev);
      next.has(dropId) ? next.delete(dropId) : next.add(dropId);
      localStorage.setItem("rescuedIds", JSON.stringify([...next]));
      return next;
    });
  }, []);

  const confirmDelete = useCallback(() => {
    const key = isDrop ? "deletedDropIds" : "deletedIds";
    const setter = isDrop ? setDeletedDropIds : setDeletedIds;
    setter(prev => {
      const next = new Set(prev);
      if (pendingDelete) next.add(pendingDelete.id);
      localStorage.setItem(key, JSON.stringify([...next]));
      return next;
    });
    setPendingDelete(null);
  }, [pendingDelete, isDrop]);

  const restoreAll = useCallback(() => {
    if (isDrop) { setDeletedDropIds(new Set()); localStorage.removeItem("deletedDropIds"); }
    else { setDeletedIds(new Set()); localStorage.removeItem("deletedIds"); }
  }, [isDrop]);

  // Merge a committed overrides.json (global favourites/deletions baked into the
  // published site) with the browser's localStorage. This is how favourites and
  // deletions become persistent across browsers/devices: hand me an exported
  // file and I commit it into web/overrides.json.
  useEffect(() => {
    fetch("overrides.json", { cache: "no-store" })
      .then(r => (r.ok ? r.json() : null))
      .then(o => {
        if (!o) return;
        const merge = (arr, setter, key) => {
          if (!Array.isArray(arr) || !arr.length) return;
          setter(prev => { const n = new Set(prev); arr.forEach(id => n.add(id));
            localStorage.setItem(key, JSON.stringify([...n])); return n; });
        };
        merge(o.deleted, setDeletedIds, "deletedIds");
        merge(o.favourites, setFavIds, "favIds");
        merge(o.favDrop, setFavDropIds, "favDropIds");
        merge(o.rescued, setRescuedIds, "rescuedIds");
        merge(o.deletedDrop, setDeletedDropIds, "deletedDropIds");
      })
      .catch(() => {});
  }, []);

  const exportChanges = useCallback(() => {
    const payload = JSON.stringify({
      favourites: [...favIds], deleted: [...deletedIds],
      favDrop: [...favDropIds], rescued: [...rescuedIds], deletedDrop: [...deletedDropIds],
    }, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
    a.download = "overrides.json"; a.click();
  }, [favIds, deletedIds, favDropIds, rescuedIds, deletedDropIds]);

  const importChanges = useCallback((file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const o = JSON.parse(reader.result);
        const merge = (arr, setter, key) => {
          if (!Array.isArray(arr)) return;
          setter(prev => { const n = new Set(prev); arr.forEach(id => n.add(id));
            localStorage.setItem(key, JSON.stringify([...n])); return n; });
        };
        merge(o.deleted, setDeletedIds, "deletedIds");
        merge(o.favourites, setFavIds, "favIds");
        merge(o.favDrop, setFavDropIds, "favDropIds");
        merge(o.rescued, setRescuedIds, "rescuedIds");
        merge(o.deletedDrop, setDeletedDropIds, "deletedDropIds");
      } catch (e) { alert("Could not read that file: " + e.message); }
    };
    reader.readAsText(file);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const SQL = await initSqlJs({ locateFile: fn => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${fn}` });
        let bytes;
        if (window.__PROPERTIES_DB_B64__) {
          // Embedded snapshot — works from file:// and over HTTP alike.
          const bin = atob(window.__PROPERTIES_DB_B64__);
          bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        } else {
          const buf = await (await fetch("properties.db", { cache: "no-store" })).arrayBuffer();
          bytes = new Uint8Array(buf);
        }
        const database = new SQL.Database(bytes);
        const q = database.exec("SELECT * FROM v_listings");
        const cols = q[0].columns, rows = q[0].values.map(v => Object.fromEntries(cols.map((c, i) => [c, v[i]])));
        const updated = (database.exec("SELECT MAX(last_seen) FROM v_listings")[0]?.values[0][0]) || "—";
        setDb(database); setAll(rows); setMeta({ n: rows.length, updated }); setStatus("ready");
        // Dropped / discarded listings (best-effort — view may be absent on old snapshots).
        try {
          const dq = database.exec("SELECT * FROM v_dropped");
          if (dq.length) {
            const dc = dq[0].columns;
            setAllDrop(dq[0].values.map(v => Object.fromEntries(dc.map((c, i) => [c, v[i]]))));
          }
        } catch (e) { /* no dropped view */ }
        // Seed favourites baked into the DB (global, cross-browser) — merge with
        // whatever is already in localStorage.
        const dbFavs = rows.filter(r => r.favourite).map(r => r.id);
        if (dbFavs.length) {
          setFavIds(prev => {
            const n = new Set(prev); dbFavs.forEach(id => n.add(id));
            localStorage.setItem("favIds", JSON.stringify([...n])); return n;
          });
        }
      } catch (e) { setStatus("error:" + e.message); }
    })();
  }, []);

  const options = useMemo(() => {
    const uniq = k => [...new Set(activeAll.map(r => r[k]).filter(v => v && v !== "?"))].sort();
    return { localities: uniq("locality"), builders: uniq("builder"), sources: uniq("source"),
             types: uniq("type"), listings: uniq("listing"), bhks: uniq("bhk"),
             priceMax: Math.max(1, Math.ceil(Math.max(0, ...activeAll.map(r => r.price_cr || 0)))) };
  }, [activeAll]);

  // Distinct value lists per (non-numeric) column for the modern column-filter menus.
  const colValues = useMemo(() => {
    const m = {};
    for (const c of activeCols) {
      if (c.num) continue;
      const s = new Set(activeAll.map(r => (r[c.k] == null || r[c.k] === "") ? "—" : String(r[c.k])));
      m[c.k] = [...s].sort((a, b) => a.localeCompare(b));
    }
    return m;
  }, [activeAll, activeCols]);

  const filtered = useMemo(() => {
    const minCr = parseFloat(f.minCr), maxCr = parseFloat(f.maxCr), minSize = parseFloat(f.minSize);
    const q = f.q.trim().toLowerCase();
    let rows = activeAll.filter(r => {
      if (activeDeleted.has(r.id)) return false;
      if (f.onlyFav && !activeFav.has(r.id)) return false;
      if (q) {
        const hay = [r.builder, r.locality, r.description, r.society, r.drop_reason, r.source, r.rera_id].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (f.locality && (r.locality || "").toLowerCase() !== f.locality.toLowerCase()) return false;
      if (f.type && r.type !== f.type) return false;
      if (f.listing && r.listing !== f.listing) return false;
      if (f.builder && r.builder !== f.builder) return false;
      if (f.source && r.source !== f.source) return false;
      if (f.onlyTarget && !TARGET.has((r.locality || "").toLowerCase())) return false;
      const priced = r.price_cr != null;
      if (f.onlyPriced && !priced) return false;
      if (!isNaN(minCr) && priced && r.price_cr < minCr) return false;
      if (!isNaN(maxCr) && priced && r.price_cr > maxCr) return false;
      if (!isNaN(minCr) && !priced && f.onlyPriced) return false;
      if (!isNaN(minSize) && r.size_sqft != null && r.size_sqft < minSize) return false;
      if (f.possession && r.possession && r.possession > f.possession) return false;
      // per-column grid filters (modern column menus)
      for (const c of activeCols) {
        const sel = colSel[c.k];
        if (!sel) continue;
        if (c.num) {
          const val = r[c.k];
          if (sel.min !== "" && sel.min != null && (val == null || val < parseFloat(sel.min))) return false;
          if (sel.max !== "" && sel.max != null && (val == null || val > parseFloat(sel.max))) return false;
        } else if (sel.length) {
          const v = (r[c.k] == null || r[c.k] === "") ? "—" : String(r[c.k]);
          if (!sel.includes(v)) return false;
        }
      }
      return true;
    });
    const { k, dir } = sort, mul = dir === "asc" ? 1 : -1;
    if (k === "relevance") {
      // Relevance = closeness to the target areas. Whitefield first, then
      // Marathahalli, then the rest of the ORR belt, then everything else;
      // ties broken by price ascending.
      const rank = (r) => {
        const loc = (r.locality || "").toLowerCase();
        if (loc.includes("whitefield")) return 0;
        if (loc.includes("marathahalli")) return 1;
        const belt = ["varthur","gunjur","panathur","kadugodi","hoodi","brookefield",
                      "bellandur","sarjapur","kaikondrahalli","hebbal","kr puram",
                      "krishnarajapuram","nagavara"];
        if (belt.some(b => loc.includes(b))) return 2;
        if (loc) return 3;
        return 4;
      };
      rows = [...rows].sort((a, b) => {
        const ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
        const pa = parseFloat(a.price_cr), pb = parseFloat(b.price_cr);
        if (isNaN(pa)) return 1; if (isNaN(pb)) return -1;
        return pa - pb;
      });
      return rows;
    }
    rows = [...rows].sort((a, b) => {
      let x = a[k], y = b[k];
      const nx = parseFloat(x), ny = parseFloat(y);
      if (!isNaN(nx) && !isNaN(ny)) { x = nx; y = ny; }
      if (x == null) return 1; if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * mul;
    });
    return rows;
  }, [activeAll, activeCols, activeDeleted, activeFav, isDrop, f, sort, colSel]);

  const stats = useMemo(() => {
    const priced = filtered.filter(r => r.price_cr != null);
    const avg = priced.length ? (priced.reduce((s, r) => s + r.price_cr, 0) / priced.length) : null;
    const targets = filtered.filter(r => TARGET.has((r.locality || "").toLowerCase())).length;
    const favs = activeAll.filter(r => activeFav.has(r.id) && !activeDeleted.has(r.id)).length;
    return { total: filtered.length, targets, avg, villas: filtered.filter(r => r.type === "villa").length, favs };
  }, [filtered, activeAll, activeFav, activeDeleted]);

  const applyCriteria = () => setF({ ...EMPTY, minCr: String(CRITERIA.minCr), maxCr: String(CRITERIA.maxCr) });

  const exportCsv = useCallback(() => {
    const cols = activeCols.map(c => c.k);
    const esc = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const cell = (r, c) => c === "fav" ? (favIds.has(r.id) ? "yes" : "") : r[c];
    const lines = [cols.map(c => c === "fav" ? "favourite" : c).join(","),
                   ...filtered.map(r => cols.map(c => esc(cell(r, c))).join(","))];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = isDrop ? "dropped.csv" : "properties.csv"; a.click();
  }, [filtered, favIds, activeCols, isDrop]);

  return (
    <div className="max-w-7xl mx-auto px-4 md:px-6 py-6">
      <header className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div>
          <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">🏙️ Bangalore Premium Property Assistant</h1>
          <p className="text-sm text-slate-500">Whitefield &amp; Marathahalli · apartments (Tier-1) + villas · ₹3–5 Cr · possession ≤ Jun 2028</p>
        </div>
        <div className="text-right text-xs text-slate-400">
          {status === "ready" ? <span>{meta.n} listings · updated {String(meta.updated).slice(0, 10)}</span>
            : status === "loading" ? <span className="animate-pulse">loading database…</span>
            : <span className="text-rose-500">{status.replace("error:", "⚠ ")}</span>}
        </div>
      </header>

      <div className="flex items-center gap-1 mb-5 border-b border-slate-200">
        {[["matches", "🏠 Matches", matchesRows.length],
          ["dropped", "🗂️ Dropped", droppedRows.length]].map(([key, label, count]) => (
          <button key={key} onClick={() => { setView(key); setF(EMPTY); setColSel({}); setSort({ k: "relevance", dir: "asc" }); }}
                  className={cls("px-4 py-2 text-sm font-semibold rounded-t-lg -mb-px border-b-2 transition",
                                 view === key ? "border-indigo-600 text-indigo-700 bg-white"
                                              : "border-transparent text-slate-500 hover:text-slate-700")}>
            {label} <span className={cls("ml-1 text-xs rounded-full px-1.5 py-0.5",
                                         view === key ? "bg-indigo-100 text-indigo-700" : "bg-slate-100 text-slate-500")}>{count}</span>
          </button>
        ))}
      </div>

      {isDrop && (
        <div className="mb-4 rounded-xl bg-orange-50 border border-orange-200 px-4 py-3 text-sm text-orange-800">
          These are NoBroker listings from the ₹4–5.5 Cr sweep that were <b>auto-discarded</b> — either no strong tier-1 builder
          name matched the society, or under 2000 sq. ft. Scan here to rescue any genuine resale unit the filter missed.
        </div>
      )}
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <Stat label="Matching" value={stats.total} sub="click to reset filters" accent="text-indigo-600"
              onClick={() => { setF(EMPTY); setColSel({}); }} />
        <Stat label="In target areas" value={stats.targets} sub="Whitefield / Marathahalli" accent="text-amber-600"
              onClick={() => setF(p => ({ ...p, onlyTarget: !p.onlyTarget }))} active={f.onlyTarget} />
        <Stat label="Villas" value={stats.villas} sub="click to show villas" accent="text-violet-600"
              onClick={() => setF(p => ({ ...p, type: p.type === "villa" ? "" : "villa" }))} active={f.type === "villa"} />
        <Stat label="★ Favourites" value={stats.favs} sub="click to show favourites" accent="text-amber-500"
              onClick={() => setF(p => ({ ...p, onlyFav: !p.onlyFav }))} active={f.onlyFav} />
        <Stat label="Avg price" value={fmtCr(stats.avg)} sub="priced only" accent="text-emerald-600" />
      </div>

      <div className="space-y-4">
        <Filters f={f} set={setF} options={options} onReset={() => { setF(EMPTY); setColSel({}); }} onCriteria={applyCriteria} />

        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
          <div className="text-sm text-slate-500">
            {filtered.length} result{filtered.length === 1 ? "" : "s"}
            {Object.keys(colSel).length > 0 &&
              <button onClick={() => setColSel({})} className="ml-3 text-xs text-indigo-600 hover:underline">clear column filters</button>}
            {activeDeleted.size > 0 &&
              <button onClick={restoreAll} className="ml-3 text-xs text-rose-600 hover:underline">restore {activeDeleted.size} hidden</button>}
            {!isDrop && rescuedIds.size > 0 &&
              <span className="ml-3 text-xs text-emerald-600">⤴ {rescuedIds.size} rescued from Dropped
                <button onClick={() => { setRescuedIds(new Set()); localStorage.removeItem("rescuedIds"); }}
                        className="ml-1 underline hover:text-emerald-700">undo all</button></span>}
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <button onClick={exportChanges} title="Download your favourites + deletions as overrides.json (to sync across browsers or send to me to bake in)"
                    className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-semibold text-slate-600 hover:bg-slate-50 shadow-sm">⬇ Export changes</button>
            <label className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-semibold text-slate-600 hover:bg-slate-50 shadow-sm cursor-pointer">
              ⬆ Import changes
              <input type="file" accept="application/json,.json" className="hidden"
                     onChange={e => { importChanges(e.target.files[0]); e.target.value = ""; }} />
            </label>
            <button onClick={exportCsv} className="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-sm font-semibold text-slate-600 hover:bg-slate-50 shadow-sm">⬇ Export CSV</button>
          </div>
        </div>

        <Table rows={filtered} cols={activeCols} view={view} sort={sort} setSort={setSort} colSel={colSel} setColSel={setColSel} colValues={colValues} onDelete={setPendingDelete} onRescue={toggleRescue} favIds={activeFav} onToggleFav={activeToggleFav} />
        {db && <SqlPanel db={db} />}
      </div>

      <ConfirmModal row={pendingDelete} onCancel={() => setPendingDelete(null)} onConfirm={confirmDelete} />

      <footer className="mt-8 text-center text-xs text-slate-400">
        Static viewer · SQLite-in-browser via sql.js · refresh data with <code className="bg-slate-100 px-1 rounded">python -m src.export_web</code>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
